<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Lemonade Production</title>
    
    <!-- Favicon -->
    <link rel="icon" type="png" href="Asset2.png">

    <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>      
    <!-- Lemonade Sip Transition Overlay -->
    <div id="sip-overlay" class="sip-overlay">
        <div class="cup-container">
            <div class="straw"></div>
            <div class="lemon-slice"></div> 
            <div class="cartoon-cup">
                <div class="liquid" id="lemonade-liquid"></div>
            </div>
        </div>
    </div>
    
    <header class="site-header">
        <a href="index.html" class="logo">LEMONADE PRODUCTION</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="story.html">Story</a>
            <a href="service.html">Service</a>
            <a href="work.html">Work</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html" class="btn-primary">Contact Us</a>
        </nav>
    </header>

<!-- Hero Section with Background Video -->
    <section class="hero animate-load">
        <video class="hero-bg-video" autoplay loop muted playsinline preload="auto">
            <source src="https://res.cloudinary.com/pqltphs3/video/upload/v1793104414/LEMONADE_AI_SHOWCASE.mp4" type="video/mp4">
        </video>
        
        <!-- 半透明暗層，確保白色字清晰 -->
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Stand out.<br>Stay fresh.</h1>
            <p>AI-Powered Creative Production Studio</p>
            <a href="work.html" class="btn-primary">Take a sip.</a>
        </div>
    </section>
	

    <!-- FIXED: Footer is now INSIDE the body tag -->
    <footer class="site-footer">
        <!-- Logo in the footer -->
        <img src="logo.svg" alt="Lemonade Production" class="footer-logo">
        <p>© 2026 Lemonade Production. All rights reserved.</p>
    </footer>

    <!-- Page Transition Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('nav a, a.btn-primary');
            const overlay = document.getElementById('sip-overlay');
            const liquid = document.getElementById('lemonade-liquid');
            const straw = document.querySelector('.straw');
            const lemon = document.querySelector('.lemon-slice'); 

            // 1. Fade away when page loads
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300); 
            }, 300); 

            // 2. Trigger animation on navigation click
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    if(this.getAttribute('href').startsWith('#') || this.getAttribute('href').startsWith('mailto:')) return;

                    e.preventDefault(); 
                    const targetUrl = this.href;

                    overlay.style.display = 'flex';
                    
                    setTimeout(() => {
                        overlay.style.opacity = '1';
                        
                        liquid.style.animation = 'sipDown 0.6s forwards ease-in-out';
                        liquid.style.animationDelay = '0.2s'; 
                        
                        straw.style.animation = 'sipStrawDown 0.6s forwards ease-in-out';
                        straw.style.animationDelay = '0.2s';

                        lemon.style.animation = 'lemonWiggle 0.6s forwards ease-in-out';
                        lemon.style.animationDelay = '0.2s';
                    }, 10);

                    // 3. Navigate to next page
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1000); 
                });
            });
        });
		
		document.addEventListener('DOMContentLoaded', () => {
    const heroSection = document.querySelector('.hero');
    let idleTimer = null;
    const idleDelay = 1800; // 靜止 1.8 秒後觸發淡出（可自由調整 1500 - 2500）

    // 定義隱藏文字、片變 100% 的函數
    function hideContent() {
        heroSection.classList.add('is-playing');
    }

    // 定義顯示文字、片恢復半透明的函數
    function showContent() {
        heroSection.classList.remove('is-playing');
    }

    // 重設閒置計時器
    function resetIdleTimer() {
        showContent(); // 只要有郁動，立刻叫返文字出嚟
        clearTimeout(idleTimer);
        // 重新倒數：如果停喺度冇郁，就執行 hideContent
        idleTimer = setTimeout(hideContent, idleDelay);
    }

    // 監聽成個視窗的 Mouse 移動與滾動
    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('scroll', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer); // 支援手機觸控

    // 頁面初次載入時，先開始倒數一次
    idleTimer = setTimeout(hideContent, idleDelay);
});
    </script>
</body>
</html>
