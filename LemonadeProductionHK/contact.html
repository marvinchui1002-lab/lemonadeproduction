<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Lemonade Production</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>		
<!-- Lemonade Sip Transition Overlay -->
    <div id="sip-overlay" class="sip-overlay">
        <div class="cup-container">
            <div class="straw"></div>
            <div class="lemon-slice"></div> <!-- NEW LEMON SLICE -->
            <div class="cartoon-cup">
                <div class="liquid" id="lemonade-liquid"></div>
            </div>
        </div>
    </div>
	
    <header class="site-header">
        <a href="index.html" class="logo">LEMONADE PRODUCTION</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="story.html">Story</a>
            <a href="service.html">Service</a>
            <a href="work.html">Work</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html" class="btn-primary">Contact Us</a>
        </nav>
    </header>

<section class="page-section animate-load">
        <h2>Ready for a Taste?</h2>
        <p style="text-align: center; max-width: 500px; margin-bottom: 30px;">
            Let’s collaborate on your next vision. Drop us an email directly:
        </p>
        
        <div style="text-align: center;">
            <!-- 撳落去直接開 Email，主旨自動幫客填好 -->
            <a href="mailto:YOUR_GMAIL@gmail.com?subject=Project%20Inquiry%20-%20Lemonade%20Production" 
               class="btn-primary" 
               style="font-size: 1.1rem; padding: 16px 36px; display: inline-block;">
                Say Hello at marvinchui1002@gmail.com
            </a>
        </div>
    </section>
<!-- Page Transition Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('nav a, a.btn-primary');
            const overlay = document.getElementById('sip-overlay');
            const liquid = document.getElementById('lemonade-liquid');
            const straw = document.querySelector('.straw');
            const lemon = document.querySelector('.lemon-slice'); // Select the lemon slice

            // 1. Fade away when page loads
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300); 
            }, 300); 

            // 2. Trigger animation on navigation click
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    if(this.getAttribute('href').startsWith('#') || this.getAttribute('href').startsWith('mailto:')) return;

                    e.preventDefault(); 
                    const targetUrl = this.href;

                    overlay.style.display = 'flex';
                    
                    setTimeout(() => {
                        overlay.style.opacity = '1';
                        
                        // Start all 3 animations in sync
                        liquid.style.animation = 'sipDown 0.6s forwards ease-in-out';
                        liquid.style.animationDelay = '0.2s'; 
                        
                        straw.style.animation = 'sipStrawDown 0.6s forwards ease-in-out';
                        straw.style.animationDelay = '0.2s';

                        lemon.style.animation = 'lemonWiggle 0.6s forwards ease-in-out';
                        lemon.style.animationDelay = '0.2s';
                    }, 10);

                    // 3. Navigate to next page
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1000); 
                });
            });
        });
    </script>
	    <!-- FIXED: Footer is now INSIDE the body tag -->
    <footer class="site-footer">
        <!-- Logo in the footer -->
        <img src="images/logo.svg" alt="Lemonade Production" class="footer-logo">
        <p>© 2026 Lemonade Production. All rights reserved.</p>
    </footer>
</body>
</html>
